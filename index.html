<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Encuentra los Libros! 🕵️‍♂️📚</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

        body {
            font-family: 'Comic Neue', cursive, sans-serif;
            background-color: #ffecd2;
            text-align: center;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1 {
            color: #ff7e67;
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        .score-board {
            font-size: 1.5em;
            background-color: #fff;
            display: inline-block;
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        #game-board {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 500px;
            margin: 0 auto;
            /* Crea la ilusión de una habitación: pared y piso */
            background: linear-gradient(to bottom, #a8e6cf 0%, #a8e6cf 65%, #ffd3b6 65%, #ffd3b6 100%);
            border: 8px solid #fff;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .item {
            position: absolute;
            font-size: 45px; /* Tamaño grande para que los niños lo vean bien */
            user-select: none;
            transition: all 0.3s ease;
        }

        .distractor {
            cursor: default;
        }

        .book {
            cursor: pointer;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.3));
        }

        .book:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .book.found {
            transform: scale(2) translateY(-20px);
            opacity: 0;
            pointer-events: none;
        }

        #win-message {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
            z-index: 10;
        }

        #win-message.hidden {
            display: none;
        }

        #win-message h2 {
            color: #4CAF50;
            font-size: 3em;
            margin: 0;
            padding: 20px;
        }

        button {
            font-family: 'Comic Neue', cursive;
            background-color: #ff7e67;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.5em;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 126, 103, 0.4);
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            background-color: #ff5c40;
        }
    </style>
</head>
<body>

    <h1>¡Encuentra los Libros Perdidos! 🕵️‍♂️</h1>
    <div class="score-board">
        Libros encontrados: <span id="score">0</span> de <span id="total">0</span>
    </div>

    <div id="game-board">
        <!-- Los objetos se generarán aquí con JavaScript -->
        <div id="win-message" class="hidden">
            <h2>¡Súper! 🎉<br>¡Encontraste todos!</h2>
            <button onclick="iniciarJuego()">Jugar de Nuevo 🔄</button>
        </div>
    </div>

    <script>
        const tablero = document.getElementById('game-board');
        const scoreEl = document.getElementById('score');
        const totalEl = document.getElementById('total');
        const mensajeVictoria = document.getElementById('win-message');

        // Emojis para los libros que hay que buscar
        const emojisLibros = ['📕', '📘', '📗', '📙', '📚'];
        // Emojis para rellenar la habitación y distraer
        const emojisDistractores = ['🧸', '🪴', '🚗', '⚽', '🎒', '👟', '🍎', '🧩', '🎸', '🛹', '🎮'];

        let score = 0;
        const totalLibros = 6; 
        const totalDistractores = 20;

        function iniciarJuego() {
            score = 0;
            scoreEl.textContent = score;
            totalEl.textContent = totalLibros;
            mensajeVictoria.classList.add('hidden');
            
            // Limpiar el tablero sin borrar el mensaje de victoria
            const items = tablero.querySelectorAll('.item');
            items.forEach(item => item.remove());

            // Generar los objetos que NO son libros
            for(let i = 0; i < totalDistractores; i++) {
                let emojiAleatorio = emojisDistractores[Math.floor(Math.random() * emojisDistractores.length)];
                crearObjeto(emojiAleatorio, false);
            }

            // Generar los libros que el niño debe encontrar
            for(let i = 0; i < totalLibros; i++) {
                let libroAleatorio = emojisLibros[Math.floor(Math.random() * emojisLibros.length)];
                crearObjeto(libroAleatorio, true);
            }
        }

        function crearObjeto(emoji, esLibro) {
            const elemento = document.createElement('div');
            elemento.textContent = emoji;
            elemento.classList.add('item');
            
            if (esLibro) {
                elemento.classList.add('book');
            } else {
                elemento.classList.add('distractor');
            }

            // Posición aleatoria dentro del tablero (evitando los bordes extremos)
            const x = Math.floor(Math.random() * 88) + 2; // Entre 2% y 90%
            const y = Math.floor(Math.random() * 82) + 2; // Entre 2% y 84%

            elemento.style.left = x + '%';
            elemento.style.top = y + '%';

            // Lógica al hacer clic en un libro
            if (esLibro) {
                elemento.onclick = function() {
                    if (!elemento.classList.contains('found')) {
                        elemento.classList.add('found'); // Activa la animación CSS
                        score++;
                        scoreEl.textContent = score;
                        
                        // Sonido simple (opcional, usando la API del navegador)
                        try {
                            let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                            let oscillator = audioCtx.createOscillator();
                            oscillator.type = 'sine';
                            oscillator.frequency.setValueAtTime(600, audioCtx.currentTime); // Tono
                            oscillator.connect(audioCtx.destination);
                            oscillator.start();
                            oscillator.stop(audioCtx.currentTime + 0.1);
                        } catch(e) {}

                        // Verificar si ganó
                        if (score === totalLibros) {
                            setTimeout(() => {
                                mensajeVictoria.classList.remove('hidden');
                            }, 400); // Pequeña pausa para ver la animación del último libro
                        }
                    }
                };
            }

            tablero.appendChild(elemento);
        }

        // Iniciar el juego automáticamente cuando la página carga
        window.onload = iniciarJuego;
    </script>
</body>
</html>
